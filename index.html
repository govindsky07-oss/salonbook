<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>सैलून बुकिंग डेमो</title>
<style>
body{font-family:sans-serif;margin:0;background:#f4f4f4;color:#222}
header{background:#1a1a2e;color:#fff;padding:12px;text-align:center;font-weight:bold}
.tabs{display:flex}.tabs button{flex:1;padding:12px;border:0;background:#ddd;font-size:16px}
.tabs button.on{background:#e94560;color:#fff}
#app{padding:12px;max-width:520px;margin:auto}
.card{background:#fff;border-radius:10px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
input[type=text],input[type=tel],input[type=date],input[type=password]{width:100%;box-sizing:border-box;padding:10px;margin:4px 0 10px;font-size:16px;border:1px solid #bbb;border-radius:6px}
button.b{padding:10px 12px;margin:3px;border:0;border-radius:6px;background:#1a1a2e;color:#fff;font-size:14px}
button.g{background:#25a244}button.r{background:#c1121f}button.s{background:#ddd;color:#000}
button.slot{padding:8px 10px;margin:3px;border:1px solid #999;border-radius:6px;background:#fff}
button.slot.on{background:#e94560;color:#fff}button.slot:disabled{background:#ccc;color:#888}
label{display:block;padding:6px 0}.small{color:#666;font-size:13px}
</style></head><body>
<header>✂️ रॉयल कट्स (डेमो)</header>
<div class="tabs"><button id="t1" onclick="V('c')">ग्राहक पेज</button><button id="t2" onclick="V('k')">दुकानदार पेज</button></div>
<div id="app"></div>
<script>
const day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);
const today=day(0),tom=day(1);
const S=[{n:"हेयरकट",p:149},{n:"दाढ़ी",p:99},{n:"हेयरकट + दाढ़ी",p:229}];
const A=[{n:"बियर्ड ट्रिम",p:99},{n:"हेड मसाज",p:199}];
const T=["10:00","11:00","12:00","13:00","15:00","16:00","17:00","18:00","19:00"];
let B=[
{t:"11:00",name:"राहुल (डेमो)",ph:"9999900001",sv:"हेयरकट",amt:149,st:"नया",d:today},
{t:"12:00",name:"विकास (डेमो)",ph:"9999900002",sv:"हेयरकट + हेड मसाज",amt:348,st:"नया",d:today},
{t:"10:00",name:"अमन (डेमो)",ph:"9999900004",sv:"दाढ़ी",amt:99,st:"नया",d:tom}];
let M=[
{name:"अमित (डेमो)",ph:"9999900003",txt:"नमस्ते अमित जी, आपको आए 25 दिन हो गए। नए हेयरकट के लिए आइए!",sent:false},
{name:"सोनू (डेमो)",ph:"9999900005",txt:"सोनू जी, आपका जन्मदिन पास है। दुकान पर 20% छूट पाइए!",sent:false}];
let view="c",login=false,tab="b",done="",err="";
let sel={name:"",ph:"",dob:"",sv:0,ad:[],date:today,slot:""};
function V(v){view=v;R()}
function R(){
 document.getElementById("t1").className=view=="c"?"on":"";
 document.getElementById("t2").className=view=="k"?"on":"";
 document.getElementById("app").innerHTML=view=="c"?C():K();
}
function C(){
 if(done)return `<div class=card><h3>✅ बुकिंग हो गई</h3><p>${done}</p><p class=small>पैसा दुकान पर दीजिए।</p><button class=b onclick="done='';R()">नई बुकिंग</button></div>`;
 const taken=B.filter(b=>b.d==sel.date&&b.st!="रद्द").map(b=>b.t);
 const tot=S[sel.sv].p+sel.ad.reduce((a,i)=>a+A[i].p,0);
 return `<div class=card>
 <b>आपका नाम</b><input type=text value="${sel.name}" oninput="sel.name=this.value">
 <b>मोबाइल नंबर</b><input type=tel maxlength=10 value="${sel.ph}" oninput="sel.ph=this.value">
 <b>जन्मतिथि (वैकल्पिक)</b><input type=date value="${sel.dob}" onchange="sel.dob=this.value"></div>
 <div class=card><b>सर्विस चुनिए</b>
 ${S.map((s,i)=>`<label><input type=radio name=sv ${sel.sv==i?"checked":""} onchange="sel.sv=${i};R()"> ${s.n} — ₹${s.p}</label>`).join("")}
 <b>ऐड-ऑन</b>
 ${A.map((a,i)=>`<label><input type=checkbox ${sel.ad.includes(i)?"checked":""} onchange="tg(${i})"> ${a.n} — ₹${a.p}</label>`).join("")}</div>
 <div class=card><b>तारीख</b><input type=date min="${today}" value="${sel.date}" onchange="sel.date=this.value;sel.slot='';R()">
 <b>खाली समय</b> <span class=small>(2-3 बजे बंद)</span><br>
 ${T.map(t=>`<button class="slot ${sel.slot==t?"on":""}" ${taken.includes(t)?"disabled":""} onclick="sel.slot='${t}';R()">${t}</button>`).join("")}</div>
 <div class=card><b>कुल: ₹${tot}</b> <span class=small>(छूट दुकान पर बिल में कटेगी)</span>
 <p style="color:#c1121f">${err}</p>
 <button class="b g" style="width:100%;font-size:17px" onclick="bk()">बुकिंग पक्की करें</button></div>`;
}
function tg(i){const k=sel.ad.indexOf(i);k>-1?sel.ad.splice(k,1):sel.ad.push(i);R()}
function bk(){
 if(!sel.name.trim()){err="नाम लिखिए";return R()}
 if(!/^\d{10}$/.test(sel.ph)){err="10 अंकों का मोबाइल नंबर लिखिए";return R()}
 if(!sel.slot){err="समय चुनिए";return R()}
 err="";
 const tot=S[sel.sv].p+sel.ad.reduce((a,i)=>a+A[i].p,0);
 const sv=[S[sel.sv].n,...sel.ad.map(i=>A[i].n)].join(" + ");
 B.push({t:sel.slot,name:sel.name,ph:sel.ph,sv,amt:tot,st:"नया",d:sel.date});
 done=`${sel.name}, ${sel.date} को ${sel.slot} बजे — ${sv} (₹${tot})`;
 sel={name:"",ph:"",dob:"",sv:0,ad:[],date:today,slot:""};R();
}
function K(){
 if(!login)return `<div class=card><b>दुकानदार लॉगिन</b><input type=text value="royalcuts" disabled>
 <input type=password id=pw placeholder="पासवर्ड (डेमो: 1234)">
 <p style="color:#c1121f">${err}</p><button class="b" onclick="lg()">लॉगिन</button></div>`;
 const tb=(k,n)=>`<button class="b ${tab==k?"":"s"}" onclick="tab='${k}';R()">${n}</button>`;
 return tb("b","बुकिंग")+tb("m","आज के मैसेज")+tb("e","कमाई")+(tab=="b"?KB():tab=="m"?KM():KE());
}
function lg(){if(document.getElementById("pw").value=="1234"){login=true;err=""}else err="पासवर्ड ग़लत है";R()}
function KB(){
 const g=(t,l)=>l.length?`<h4>${t}</h4>`+l.map(x=>`<div class=card><b>${x.t}</b> — ${x.name}<br><span class=small>${x.ph} · ${x.sv} · ₹${x.amt}</span><br><b>${x.st}</b><br>
 <button class="b g" onclick="st(${B.indexOf(x)},'आया')">आया</button><button class="b g" onclick="st(${B.indexOf(x)},'पूरा')">पूरा हुआ</button><button class="b r" onclick="st(${B.indexOf(x)},'नहीं आया')">नहीं आया</button><button class="b r" onclick="st(${B.indexOf(x)},'रद्द')">रद्द</button><button class=b onclick="wa('${x.ph}','नमस्ते ${x.name}, आपकी बुकिंग ${x.t} बजे की है।')">WhatsApp</button></div>`).join(""):"";
 const s=(a,b)=>a.d==b.d?a.t.localeCompare(b.t):a.d.localeCompare(b.d);
 return g("आज",B.filter(x=>x.d==today).sort(s))+g("कल",B.filter(x=>x.d==tom).sort(s))+g("आगे",B.filter(x=>x.d>tom).sort(s))+g("पुरानी",B.filter(x=>x.d<today).sort(s));
}
function st(i,s){B[i].st=s;R()}
function wa(ph,t){window.open("https://wa.me/91"+ph+"?text="+encodeURIComponent(t),"_blank")}
function KM(){return M.map((m,i)=>`<div class=card><b>${m.name}</b> ${m.sent?"✔":""}<br><span class=small>${m.txt}</span><br><button class="b g" onclick="M[${i}].sent=true;wa('${m.ph}',M[${i}].txt);R()">WhatsApp भेजें</button></div>`).join("")}
function KE(){
 const d=B.filter(x=>x.st=="पूरा");
 const td=d.filter(x=>x.d==today).reduce((a,x)=>a+x.amt,0);
 const m={};d.forEach(x=>m[x.name]=(m[x.name]||0)+x.amt);
 const top=Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,20);
 return `<div class=card><b>आज की कमाई: ₹${td}</b><p class=small>"पूरा हुआ" दबाने पर जुड़ती है</p></div>
 <div class=card><b>टॉप ग्राहक</b>${top.length?top.map(x=>`<p>${x[0]} — ₹${x[1]}</p>`).join(""):"<p class=small>अभी कोई नहीं</p>"}</div>`;
}
R();
</script></body></html>
