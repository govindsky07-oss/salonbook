<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>सलून बुक</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Teko:wght@500;600&display=swap">
<style>
/* Layout: एक संकरा मोबाइल कॉलम। ऊपर नाई के खंभे वाली पट्टी (इकलौता चटक रंग), नीचे शांत नीला-स्लेटी आधार। */
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --ink:#12202B; --muted:#58697A; --line:#D6DDE2;
  --accent:#B8322A; --on-accent:#FFFFFF; --blue:#1F4E79; --ok:#1E7A4C; --warn:#9A6200; --soft:#E4EAEE;
  --f-body:'Hind','Noto Sans Devanagari',system-ui,sans-serif;
  --f-display:'Teko','Hind',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --surface:#16222B; --ink:#E8EEF2; --muted:#93A3AF; --line:#26353F;
  --accent:#E2584D; --on-accent:#1A0B0A; --blue:#7FB2E0; --ok:#4CC38A; --warn:#E0A33A; --soft:#1D2B35; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E161C; --surface:#16222B; --ink:#E8EEF2; --muted:#93A3AF; --line:#26353F;
  --accent:#E2584D; --on-accent:#1A0B0A; --blue:#7FB2E0; --ok:#4CC38A; --warn:#E0A33A; --soft:#1D2B35; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:560px;margin:0 auto}
.pole{height:8px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) ;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
header{padding:14px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1;margin:0;letter-spacing:.3px}
.shop{color:var(--muted);font-size:14px}
.demo{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
h2{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.1;margin:0 0 8px}
h3{font-size:15px;margin:0 0 8px;font-weight:700}
.seg{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:10px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 15px var(--f-body);padding:9px 8px;border-radius:7px;cursor:pointer;min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;line-height:20px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row>*{min-width:0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.opt:first-of-type{border-top:0}
.opt input{width:20px;height:20px;accent-color:var(--blue);flex:0 0 auto}
.opt .n{flex:1;min-width:0}
.price{font-family:var(--f-display);font-size:22px;font-weight:500;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);padding:1px 8px;border-radius:6px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.chip.day{display:flex;flex-direction:column;align-items:center;min-width:62px;line-height:1.25}
label.f{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=search],textarea{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:92px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,.opt:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;background:var(--accent);color:var(--on-accent);font:700 16px var(--f-body);padding:12px 18px;cursor:pointer;text-decoration:none}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{font-size:14px;padding:7px 12px;border-radius:8px}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.total{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1}
.err{color:var(--accent);font-size:14px;margin-top:8px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.came{color:var(--blue)} .pill.done{color:var(--ok)} .pill.noshow,.pill.cancel{color:var(--accent)}
.bk{display:grid;grid-template-columns:72px 1fr;gap:12px}
.bk .t{font-family:var(--f-display);font-size:26px;line-height:1;font-weight:600}
.bk .t small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.rank i{font-style:normal;font-family:var(--f-display);font-size:20px;color:var(--muted)}
.sent{opacity:.55}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;margin-bottom:12px}
.set{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .l{display:flex;gap:10px;align-items:center}
.set .l input{width:20px;height:20px;accent-color:var(--blue);flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw}
.okbox{border-color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.card,.stat{transition:border-color .15s}}
</style>

<div class="pole" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <h1>सलून बुक</h1>
    <div class="shop" id="shopname"></div>
  </header>
  <div class="demo" id="demonote" hidden>यह प्रोटोटाइप है। इसमें दिखने वाले नाम, नंबर और बुकिंग नकली डेमो डेटा हैं। ग्राहक वाले पेज से बुकिंग करो, वह दुकानदार वाले पेज में दिख जाएगी।</div>
  <div class="seg" id="modeseg" hidden role="group" aria-label="पेज चुनें">
    <button id="m-cust" data-act="mode" data-v="cust">ग्राहक का पेज</button>
    <button id="m-own" data-act="mode" data-v="own">दुकानदार का पेज</button>
  </div>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'₹'+Number(n).toLocaleString('en-IN');
const today=new Date();today.setHours(0,0,0,0);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const mmdd=d=>p2(d.getMonth()+1)+'-'+p2(d.getDate());
const WD=['रवि','सोम','मंगल','बुध','गुरु','शुक्र','शनि'];
const MO=['जन','फ़र','मार्च','अप्रै','मई','जून','जुल','अग','सित','अक्टू','नव','दिस'];
const T0=ymd(today),T1=ymd(addD(today,1)),T2=ymd(addD(today,2));
function daysUntil(md){const[m,d]=md.split('-').map(Number);let t=new Date(today.getFullYear(),m-1,d);if(t<today)t=new Date(today.getFullYear()+1,m-1,d);return Math.round((t-today)/864e5)}
function bdayLabel(md){const[m,d]=md.split('-').map(Number);return d+' '+MO[m-1]}

const SERVICES=[{id:'cut',n:'कटिंग',p:100,on:true},{id:'beard',n:'दाढ़ी सेट',p:60,on:true},{id:'wash',n:'हेयर वॉश',p:40,on:true}];
const ADDONS=[{id:'trim',n:'बियर्ड ट्रिम',p:99,on:true},{id:'massage',n:'हेड मसाज',p:199,on:true},{id:'clean',n:'फेस क्लीनअप',p:149,on:true}];
const ALL=[...SERVICES,...ADDONS];
const SLOTS=[];for(let h=10;h<20;h++){if(h===14)continue;SLOTS.push(p2(h)+':00',p2(h)+':30')}
const tm12=t=>{let[h,m]=t.split(':').map(Number);const s=h>=12?'PM':'AM';h=h%12||12;return h+':'+p2(m)+' '+s};
const bd=n=>mmdd(addD(today,n));

const S={
  mode:'cust',loggedIn:false,tab:'bk',bf:'today',done:null,loginErr:'',q:'',
  set:{shop:'रॉयल कट्स सलून',
    remOn:true,remDays:25,bdayOn:true,bdayBefore:5,bdayOff:20,firstOn:true,firstOff:10,refOn:true,refOff:15,
    tplRem:'नमस्ते {नाम} जी, आपके बाल बड़े हो गए होंगे। आइए, कटवा लीजिए! बुकिंग करें: {लिंक} – {दुकान}',
    tplBday:'जन्मदिन मुबारक {नाम} जी! इस हफ़्ते हमारी तरफ़ से {छूट}% की छूट। बुकिंग करें: {लिंक} – {दुकान}'},
  customers:[
    {name:'सुनील वर्मा',phone:'9800000001',last:0,visits:14,spent:2860,bday:bd(0)},
    {name:'राहुल शर्मा',phone:'9800000002',last:25,visits:9,spent:1780,bday:'03-14'},
    {name:'अमित यादव',phone:'9800000003',last:27,visits:22,spent:5240,bday:'07-02'},
    {name:'विकास गुप्ता',phone:'9800000004',last:31,visits:6,spent:1190,bday:bd(5)},
    {name:'रोहित सिंह',phone:'9800000005',last:12,visits:17,spent:4110,bday:bd(2)},
    {name:'मोहित जैन',phone:'9800000006',last:8,visits:11,spent:2430,bday:''},
    {name:'कुणाल पटेल',phone:'9800000007',last:68,visits:4,spent:620,bday:''},
    {name:'दीपक मिश्रा',phone:'9800000008',last:19,visits:30,spent:7050,bday:'11-20'},
    {name:'संजय कुमार',phone:'9800000009',last:44,visits:8,spent:1560,bday:''}
  ],
  sent:{},
  bookings:[
    {id:1,date:T0,time:'10:30',name:'सुनील वर्मा',phone:'9800000001',svc:['cut','beard'],total:160,st:'done'},
    {id:2,date:T0,time:'11:30',name:'दीपक मिश्रा',phone:'9800000008',svc:['cut','massage'],total:299,st:'came'},
    {id:3,date:T0,time:'12:30',name:'अमित यादव',phone:'9800000003',svc:['cut'],total:100,st:'booked'},
    {id:4,date:T0,time:'16:00',name:'विकास गुप्ता',phone:'9800000004',svc:['cut','trim'],total:199,st:'booked'},
    {id:5,date:T1,time:'11:00',name:'रोहित सिंह',phone:'9800000005',svc:['cut','beard'],total:160,st:'booked'},
    {id:6,date:T1,time:'17:30',name:'मोहित जैन',phone:'9800000006',svc:['beard','clean'],total:209,st:'booked'},
    {id:7,date:T2,time:'12:00',name:'राहुल शर्मा',phone:'9800000002',svc:['cut'],total:100,st:'booked'},
    {id:8,date:ymd(addD(today,-1)),time:'11:00',name:'रोहित सिंह',phone:'9800000005',svc:['cut'],total:100,st:'done'},
    {id:9,date:ymd(addD(today,-1)),time:'15:30',name:'संजय कुमार',phone:'9800000009',svc:['cut','beard'],total:160,st:'noshow'},
    {id:10,date:ymd(addD(today,-2)),time:'18:00',name:'मोहित जैन',phone:'9800000006',svc:['cut','massage'],total:299,st:'done'}
  ],
  nextId:11,
  draft:{svc:[],add:[],date:T0,time:null,name:'',phone:'',bday:'',err:''}
};
const ST={booked:'बुक',came:'आया',done:'पूरा हुआ',noshow:'नहीं आया',cancel:'रद्द'};
const svcText=ids=>ids.map(i=>(ALL.find(a=>a.id===i)||{}).n).filter(Boolean).join(' + ');
const link=()=>location.href.split('#')[0];
function fill(t,c,off){return t.replace(/\{नाम\}/g,c.name.split(' ')[0]).replace(/\{दुकान\}/g,S.set.shop).replace(/\{छूट\}/g,off||'').replace(/\{लिंक\}/g,link())}
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}

/* ---------- ग्राहक का पेज ---------- */
function slotsFor(date){
  const taken=new Set(S.bookings.filter(b=>b.date===date&&b.st!=='cancel').map(b=>b.time));
  const now=new Date();const nowM=now.getHours()*60+now.getMinutes();
  return SLOTS.map(t=>{const[h,m]=t.split(':').map(Number);const past=date===T0&&h*60+m<=nowM;return{t,off:taken.has(t)||past}});
}
function custView(){
  const d=S.draft;
  if(S.done){const b=S.done;return `
    <div class="card okbox">
      <h2>बुकिंग पक्की हो गई</h2>
      <p style="margin:0 0 10px">${esc(b.name)} जी, आपका समय ${fmtDay(b.date)} को ${tm12(b.time)} है।</p>
      <p class="muted" style="margin:0 0 4px">${esc(svcText(b.svc))}</p>
      <div class="row" style="margin:10px 0"><span class="muted">कुल अंदाज़ा</span><span class="total">${rs(b.total)}</span></div>
      <div class="demo" style="margin:0 0 12px">पैसा ऐप में नहीं लगेगा। भुगतान दुकान पर करें।</div>
      <button class="btn block" data-act="newbook">नई बुकिंग करें</button>
    </div>
    <div class="card"><h3>दुकानदार को क्या दिखेगा</h3><p class="muted" style="margin:0">ऊपर "दुकानदार का पेज" खोलकर लॉगिन करो। यह बुकिंग "आज की बुकिंग" या "कल" में समय के साथ दिखेगी।</p></div>`}
  const sv=d.svc.concat(d.add);
  let total=sv.reduce((a,i)=>a+ALL.find(x=>x.id===i).p,0);
  const isNew=d.phone.length>=10&&!S.customers.some(c=>c.phone===d.phone);
  const days=[0,1,2,3,4,5].map(n=>addD(today,n));
  return `
  <div class="card">
    <h2>सर्विस चुनो</h2>
    ${SERVICES.filter(s=>s.on).map(s=>opt(s,'svc',d.svc)).join('')}
  </div>
  <div class="card">
    <h2>साथ में जोड़ें</h2>
    ${ADDONS.filter(s=>s.on).map(s=>opt(s,'add',d.add,true)).join('')}
  </div>
  <div class="card">
    <h2>तारीख और समय</h2>
    <div class="chips" style="margin-bottom:12px">
      ${days.map(x=>`<button class="chip day" data-act="date" data-v="${ymd(x)}" aria-pressed="${d.date===ymd(x)}"><span>${x.getTime()===today.getTime()?'आज':WD[x.getDay()]}</span><span>${x.getDate()} ${MO[x.getMonth()]}</span></button>`).join('')}
    </div>
    <div class="chips">
      ${slotsFor(d.date).map(s=>`<button class="chip" data-act="time" data-v="${s.t}" ${s.off?'disabled':''} aria-pressed="${d.time===s.t}">${tm12(s.t)}</button>`).join('')}
    </div>
    <p class="muted small" style="margin:10px 0 0">2:00 से 3:00 बजे तक दुकान बंद रहती है। कटे हुए समय पहले से बुक हैं।</p>
  </div>
  <div class="card">
    <h2>आपकी जानकारी</h2>
    <label class="f" for="c-name">नाम</label>
    <input type="text" id="c-name" autocomplete="name" value="${esc(d.name)}" placeholder="जैसे: अजय कुमार">
    <label class="f" for="c-phone">मोबाइल नंबर</label>
    <input type="tel" id="c-phone" inputmode="numeric" maxlength="10" autocomplete="tel" value="${esc(d.phone)}" placeholder="10 अंकों का नंबर">
    <label class="f" for="c-bday">जन्मतिथि (वैकल्पिक)</label>
    <input type="date" id="c-bday" value="${esc(d.bday)}" style="width:100%;font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px">
    <p class="muted small" style="margin:6px 0 0">जन्मदिन पर सरप्राइज़ ऑफ़र पाने के लिए। साल बताना ज़रूरी नहीं।</p>
  </div>
  <div class="card">
    <div class="row"><span>कुल अंदाज़ा</span><span class="total">${rs(total)}</span></div>
    ${S.set.firstOn&&isNew?`<p class="muted small" style="margin:8px 0 0">पहली बुकिंग पर ${S.set.firstOff}% छूट। यह दुकान पर बिल में कटेगी।</p>`:''}
    ${d.err?`<div class="err" role="alert">${esc(d.err)}</div>`:''}
    <button class="btn block" style="margin-top:12px" data-act="book">बुकिंग पक्की करें</button>
    <p class="muted small" style="margin:10px 0 0;text-align:center">भुगतान दुकान पर होगा। ऐप में कोई पैसा नहीं लगता।</p>
  </div>
  ${S.set.refOn?`<div class="card"><h3>दोस्त को भेजो</h3><p class="muted" style="margin:0">दोस्त के पहली बार आने पर आप दोनों को ${S.set.refOff}% छूट मिलेगी।</p></div>`:''}`;
}
function opt(s,g,sel,up){return `<label class="opt"><input type="checkbox" data-act="pick" data-g="${g}" data-v="${s.id}" ${sel.includes(s.id)?'checked':''}><span class="n">${s.n}${up?'<span class="tag">'+s.p+' में जोड़ें</span>':''}</span><span class="price">${rs(s.p)}</span></label>`}
function fmtDay(ds){const[y,m,d]=ds.split('-').map(Number);const x=new Date(y,m-1,d);const diff=Math.round((x-today)/864e5);return diff===0?'आज':diff===1?'कल':diff===-1?'कल (बीता)':WD[x.getDay()]+' '+d+' '+MO[m-1]}

/* ---------- दुकानदार का पेज ---------- */
function ownView(){
  if(!S.loggedIn)return `
  <div class="card">
    <h2>दुकानदार लॉगिन</h2>
    <label class="f" for="l-name">दुकान का नाम</label>
    <input type="text" id="l-name" value="रॉयल कट्स सलून" autocomplete="username">
    <label class="f" for="l-pass">पासवर्ड</label>
    <input type="password" id="l-pass" autocomplete="current-password" placeholder="पासवर्ड डालो">
    ${S.loginErr?`<div class="err" role="alert">${S.loginErr}</div>`:''}
    <button class="btn block" style="margin-top:14px" data-act="login">लॉगिन</button>
    <p class="muted small" style="margin:10px 0 0">डेमो के लिए पासवर्ड: 1234</p>
  </div>`;
  const due=dueList();const left=due.filter(x=>!S.sent[x.key]).length;
  const tabs=[['bk','बुकिंग'],['msg','आज के मैसेज'],['cu','ग्राहक'],['db','कमाई'],['st','सेटिंग']];
  return `
  <div class="tabs" role="group" aria-label="दुकानदार मेनू">
    ${tabs.map(([k,n])=>`<button data-act="tab" data-v="${k}" aria-pressed="${S.tab===k}">${n}${k==='msg'&&left?'<span class="badge">'+left+'</span>':''}</button>`).join('')}
  </div>`+({bk:bkView,msg:msgView,cu:cuView,db:dbView,st:stView}[S.tab])(due);
}
function bkView(){
  const f=S.bf;
  let list=S.bookings.filter(b=>f==='today'?b.date===T0:f==='tom'?b.date===T1:f==='later'?b.date>T1:b.date<T0);
  list.sort((a,b)=>(f==='past'?b.date.localeCompare(a.date):a.date.localeCompare(b.date))||a.time.localeCompare(b.time));
  const fl=[['today','आज'],['tom','कल'],['later','आगे'],['past','पुरानी']];
  return `<div class="chips" style="margin-bottom:12px">${fl.map(([k,n])=>`<button class="chip" data-act="bf" data-v="${k}" aria-pressed="${f===k}">${n}</button>`).join('')}</div>`+
  (list.length?list.map(b=>`
  <div class="card bk">
    <div class="t">${tm12(b.time).split(' ')[0]}<small>${tm12(b.time).split(' ')[1]}${f==='later'||f==='past'?' · '+fmtDay(b.date):''}</small></div>
    <div>
      <div class="row"><b>${esc(b.name)}</b><span class="pill ${b.st}">${ST[b.st]}</span></div>
      <div class="muted">${esc(b.phone)}</div>
      <div class="muted">${esc(svcText(b.svc))} · ${rs(b.total)}</div>
      <div class="acts">
        ${b.st==='booked'?`<button class="btn sm ok" data-act="st" data-id="${b.id}" data-v="came">आया</button><button class="btn sm ghost" data-act="st" data-id="${b.id}" data-v="noshow">नहीं आया</button><button class="btn sm ghost" data-act="st" data-id="${b.id}" data-v="cancel">रद्द</button>`:''}
        ${b.st==='came'?`<button class="btn sm ok" data-act="st" data-id="${b.id}" data-v="done">पूरा हुआ</button>`:''}
        <a class="btn sm ghost" href="https://wa.me/91${esc(b.phone)}" target="_blank" rel="noopener">WhatsApp</a>
      </div>
    </div>
  </div>`).join(''):`<div class="empty">इस दिन कोई बुकिंग नहीं है।</div>`);
}
function dueList(){
  const out=[];const s=S.set;
  if(s.remOn)S.customers.forEach(c=>{if(c.last!==null&&c.last>=s.remDays)out.push({key:'r'+c.phone,kind:'rem',c,txt:'आख़िरी विज़िट '+c.last+' दिन पहले'})});
  if(s.bdayOn)S.customers.forEach(c=>{if(!c.bday)return;const u=daysUntil(c.bday);if(u<=s.bdayBefore)out.push({key:'b'+c.phone,kind:'bday',c,txt:'जन्मदिन '+(u===0?'आज है':u+' दिन बाद')+' ('+bdayLabel(c.bday)+')'})});
  return out;
}
function msgView(due){
  const left=due.filter(x=>!S.sent[x.key]).length;
  const rem=due.filter(x=>x.kind==='rem'),bday=due.filter(x=>x.kind==='bday');
  const sec=(t,l)=>`<h3 style="margin-top:6px">${t} (${l.length})</h3>`+(l.length?l.map(x=>{
    const txt=fill(x.kind==='rem'?S.set.tplRem:S.set.tplBday,x.c,S.set.bdayOff);
    const sent=S.sent[x.key];
    return `<div class="card ${sent?'sent':''}"><div class="row"><div><b>${esc(x.c.name)}</b><div class="muted">${x.txt}</div></div>
    ${sent?'<span class="pill done">✔ भेजा गया</span>':`<a class="btn sm ok" data-act="send" data-k="${x.key}" href="https://wa.me/91${esc(x.c.phone)}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">WhatsApp भेजो</a>`}</div></div>`}).join(''):'<div class="empty">आज इसमें कोई नहीं है।</div>');
  return `<div class="card"><div class="total">${left}</div><div class="muted">मैसेज आज भेजने बाक़ी हैं</div></div>`+sec('रिमाइंडर: बाल कटवाने का समय',rem)+sec('जन्मदिन',bday)+
  `<p class="muted small">बटन दबाने पर WhatsApp खुलेगा और मैसेज लिखा मिलेगा। आपको बस Send दबाना है।</p>`;
}
function cuView(){
  const q=S.q.trim().toLowerCase();
  const l=S.customers.filter(c=>!q||c.name.toLowerCase().includes(q)||c.phone.includes(q)).sort((a,b)=>(a.last??999)-(b.last??999));
  return `<label class="f" for="q" style="margin-top:0">ग्राहक खोजो</label><input type="search" id="q" value="${esc(S.q)}" placeholder="नाम या नंबर" style="margin-bottom:12px">`+
  (l.length?l.map(c=>`<div class="card"><div class="row"><b>${esc(c.name)}</b>${c.last!==null&&c.last>=60?'<span class="pill noshow">60+ दिन से नहीं आए</span>':''}</div>
  <div class="muted">${esc(c.phone)}</div>
  <div class="muted">${c.visits} विज़िट · आख़िरी: ${c.last===null?'अभी तक नहीं':c.last===0?'आज':c.last+' दिन पहले'}${c.bday?' · जन्मदिन '+bdayLabel(c.bday):''}</div></div>`).join(''):'<div class="empty">कोई ग्राहक नहीं मिला।</div>');
}
function dbView(){
  const t=S.bookings.filter(b=>b.date===T0);
  const earn=t.filter(b=>b.st==='done').reduce((a,b)=>a+b.total,0);
  const pend=t.filter(b=>b.st==='booked'||b.st==='came');
  const top=[...S.customers].sort((a,b)=>b.spent-a.spent).slice(0,20);
  const away=S.customers.filter(c=>c.last!==null&&c.last>=60).length;
  return `<div class="stats">
    <div class="stat"><b>${rs(earn)}</b><span>आज की कमाई</span></div>
    <div class="stat"><b>${t.filter(b=>b.st==='done').length}</b><span>आज पूरे हुए</span></div>
    <div class="stat"><b>${pend.length}</b><span>अभी बाक़ी बुकिंग</span></div>
    <div class="stat"><b>${away}</b><span>60 दिन से नहीं आए</span></div></div>
  <div class="card"><h2>सबसे ज़्यादा पैसा देने वाले ग्राहक</h2>
    ${top.map((c,i)=>`<div class="rank"><i>${i+1}</i><div><b>${esc(c.name)}</b><div class="muted small">${c.visits} विज़िट</div></div><span class="price">${rs(c.spent)}</span></div>`).join('')}</div>
  <p class="muted small">कमाई का आँकड़ा तब बनता है जब आप बुकिंग पर "पूरा हुआ" दबाते हो।</p>`;
}
function stView(){
  const s=S.set;
  const r=(id,on,l,val,unit)=>`<div class="set"><label class="l"><input type="checkbox" id="${id}-on" ${s[on]?'checked':''}><span>${l}</span></label><div class="row" style="gap:4px"><input type="number" id="${id}" min="0" max="365" value="${val}" aria-label="${l}"><span class="muted small">${unit}</span></div></div>`;
  const pr=x=>`<div class="set"><label class="l"><input type="checkbox" id="on-${x.id}" ${x.on?'checked':''}><span>${x.n}</span></label><div class="row" style="gap:4px"><span class="muted small">₹</span><input type="number" id="pr-${x.id}" min="0" max="9999" value="${x.p}" aria-label="${x.n} का रेट"></div></div>`;
  return `<div class="card"><h2>सर्विस के रेट</h2><p class="muted small" style="margin:0 0 4px">रेट बदलोगे तो ग्राहक को नया रेट दिखेगा। टिक हटाने पर वह सर्विस ग्राहक को नहीं दिखेगी। पुरानी बुकिंग का हिसाब नहीं बदलता।</p>
    <h3 style="margin-top:10px">मुख्य सर्विस</h3>${SERVICES.map(pr).join('')}
    <h3 style="margin-top:14px">साथ में जोड़ने वाली (ऐड-ऑन)</h3>${ADDONS.map(pr).join('')}
  </div>
  <div class="card"><h2>ऑफ़र और दिन</h2>
    ${r('remDays','remOn','रिमाइंडर: कितने दिन बाद',s.remDays,'दिन')}
    ${r('bdayBefore','bdayOn','जन्मदिन मैसेज: कितने दिन पहले',s.bdayBefore,'दिन')}
    <div class="set"><span class="muted">जन्मदिन की छूट</span><div class="row" style="gap:4px"><input type="number" id="bdayOff" min="0" max="100" value="${s.bdayOff}" aria-label="जन्मदिन की छूट"><span class="muted small">%</span></div></div>
    ${r('firstOff','firstOn','पहली बुकिंग की छूट',s.firstOff,'%')}
    ${r('refOff','refOn','रेफरल की छूट',s.refOff,'%')}
  </div>
  <div class="card"><h2>मैसेज</h2>
    <label class="f" for="tplRem" style="margin-top:0">रिमाइंडर मैसेज</label><textarea id="tplRem">${esc(s.tplRem)}</textarea>
    <label class="f" for="tplBday">जन्मदिन मैसेज</label><textarea id="tplBday">${esc(s.tplBday)}</textarea>
    <p class="muted small" style="margin:8px 0 0">इन्हें लिख सकते हो: {नाम} {दुकान} {छूट} {लिंक}</p>
  </div>
  <button class="btn block" data-act="save">सेव करो</button>`;
}

/* ---------- रेंडर और इवेंट ---------- */
function render(){
  $('#shopname').textContent=S.set.shop;
  $('#m-cust').setAttribute('aria-pressed',S.mode==='cust');
  $('#m-own').setAttribute('aria-pressed',S.mode==='own');
  $('#app').innerHTML=S.mode==='cust'?custView():ownView();
}
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='c-name')S.draft.name=e.target.value;
  if(id==='c-phone'){S.draft.phone=e.target.value.replace(/\D/g,'');}
  if(id==='c-bday')S.draft.bday=e.target.value;
  if(id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
});
document.addEventListener('change',e=>{
  const t=e.target;if(t.dataset&&t.dataset.act==='pick'){
    const a=S.draft[t.dataset.g];const v=t.dataset.v;const i=a.indexOf(v);
    if(t.checked&&i<0)a.push(v);if(!t.checked&&i>=0)a.splice(i,1);render();
  }
  if(t.id==='c-phone'&&S.draft.phone.length>=10)render();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  const a=b.dataset.act,v=b.dataset.v,d=S.draft;
  if(a==='mode'){S.mode=v;render();return}
  if(a==='date'){d.date=v;d.time=null;render();return}
  if(a==='time'){d.time=v;render();return}
  if(a==='newbook'){S.done=null;S.draft={svc:[],add:[],date:T0,time:null,name:'',phone:'',bday:'',err:''};render();return}
  if(a==='book'){
    d.name=val('c-name').trim()||d.name;d.phone=(val('c-phone')||d.phone).replace(/\D/g,'');d.bday=val('c-bday')||d.bday;
    const sv=d.svc.concat(d.add);
    d.err=!sv.length?'पहले कोई सर्विस चुनो।':!d.time?'समय चुनो।':!d.name.trim()?'अपना नाम लिखो।':d.phone.length!==10?'मोबाइल नंबर 10 अंकों का होना चाहिए।':'';
    if(d.err){render();return}
    const total=sv.reduce((x,i)=>x+ALL.find(z=>z.id===i).p,0);
    const bk={id:S.nextId++,date:d.date,time:d.time,name:d.name.trim(),phone:d.phone,svc:sv,total,st:'booked'};
    S.bookings.push(bk);
    if(!S.customers.some(c=>c.phone===d.phone)){
      const bdm=d.bday?d.bday.slice(5):'';
      S.customers.push({name:bk.name,phone:bk.phone,last:null,visits:0,spent:0,bday:bdm});
    }
    S.done=bk;render();window.scrollTo(0,0);return;
  }
  if(a==='login'){
    if(val('l-pass')==='1234'){S.loggedIn=true;S.loginErr='';}else S.loginErr='पासवर्ड गलत है। डेमो पासवर्ड 1234 है।';
    render();return;
  }
  if(a==='tab'){S.tab=v;render();return}
  if(a==='bf'){S.bf=v;render();return}
  if(a==='st'){
    const bk=S.bookings.find(x=>x.id==b.dataset.id);bk.st=v;
    if(v==='done'){const c=S.customers.find(x=>x.phone===bk.phone);if(c){c.last=0;c.visits++;c.spent+=bk.total}}
    render();toast(v==='done'?'पूरा हुआ। कमाई में जुड़ गया।':'बुकिंग अपडेट हो गई।');return;
  }
  if(a==='send'){const k=b.dataset.k;setTimeout(()=>{S.sent[k]=true;render()},50);return}
  if(a==='save'){
    const n=(id,mx)=>Math.max(0,Math.min(mx,parseInt(val(id),10)||0));
    const c=id=>document.getElementById(id).checked;
    ALL.forEach(x=>{x.p=n('pr-'+x.id,9999);x.on=c('on-'+x.id)});
    S.draft.svc=S.draft.svc.filter(i=>ALL.find(a=>a.id===i).on);S.draft.add=S.draft.add.filter(i=>ALL.find(a=>a.id===i).on);
    Object.assign(S.set,{remDays:n('remDays',365),remOn:c('remDays-on'),bdayBefore:n('bdayBefore',60),bdayOn:c('bdayBefore-on'),bdayOff:n('bdayOff',100),
      firstOff:n('firstOff',100),firstOn:c('firstOff-on'),refOff:n('refOff',100),refOn:c('refOff-on'),tplRem:val('tplRem'),tplBday:val('tplBday')});
    render();toast('सेटिंग सेव हो गई।');return;
  }
});
function route(){
  const h=location.hash,demo=h==='#demo'||location.protocol==='file:';
  $('#modeseg').hidden=!demo;$('#demonote').hidden=!demo;
  if(!demo)S.mode=h==='#dukandar'?'own':'cust';
  render();
}
addEventListener('hashchange',route);
route();
})();
</script>
