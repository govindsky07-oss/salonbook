<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>सलून बुक</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;600;700&family=Teko:wght@500;600&display=swap">
<style>
:root{
  --bg:#EEF1F3; --surface:#FFFFFF; --ink:#12202B; --muted:#58697A; --line:#D6DDE2;
  --accent:#B8322A; --on-accent:#FFFFFF; --blue:#1F4E79; --ok:#1E7A4C; --soft:#E4EAEE;
  --f-body:'Hind','Noto Sans Devanagari',system-ui,sans-serif;
  --f-display:'Teko','Hind',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E161C; --surface:#16222B; --ink:#E8EEF2; --muted:#93A3AF; --line:#26353F;
  --accent:#E2584D; --on-accent:#1A0B0A; --blue:#7FB2E0; --ok:#4CC38A; --soft:#1D2B35; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:560px;margin:0 auto}
.pole{height:8px;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,#fff 12px 24px,var(--blue) 24px 36px,#fff 36px 48px)}
header{padding:14px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--f-display);font-weight:600;font-size:34px;line-height:1;margin:0;letter-spacing:.3px}
.shop{color:var(--muted);font-size:14px}
h2{font-family:var(--f-display);font-weight:500;font-size:26px;line-height:1.1;margin:0 0 8px}
h3{font-size:15px;margin:0 0 8px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:10px;background:var(--accent);color:var(--on-accent);font-size:12px;line-height:20px;text-align:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.row>*{min-width:0}
.muted{color:var(--muted);font-size:14px}
.small{font-size:13px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.opt:first-of-type{border-top:0}
.opt input{width:20px;height:20px;accent-color:var(--blue);flex:0 0 auto}
.opt .n{flex:1;min-width:0}
.price{font-family:var(--f-display);font-size:22px;font-weight:500;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--soft);padding:1px 8px;border-radius:6px;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body);padding:8px 12px;border-radius:8px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip:disabled{opacity:.4;cursor:not-allowed;text-decoration:line-through}
.chip.day{display:flex;flex-direction:column;align-items:center;min-width:62px;line-height:1.25}
label.f{display:block;font-size:14px;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=search],input[type=date],textarea{width:100%;font:16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
textarea{min-height:92px;resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:9px;background:var(--accent);color:var(--on-accent);font:700 16px var(--f-body);padding:12px 18px;cursor:pointer;text-decoration:none}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{font-size:14px;padding:7px 12px;border-radius:8px}
.btn.ok{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.total{font-family:var(--f-display);font-size:34px;font-weight:600;line-height:1}
.err{color:var(--accent);font-size:14px;margin-top:8px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
.pill.came{color:var(--blue)} .pill.done{color:var(--ok)} .pill.noshow,.pill.cancel{color:var(--accent)}
.bk{display:grid;grid-template-columns:72px 1fr;gap:12px}
.bk .t{font-family:var(--f-display);font-size:26px;line-height:1;font-weight:600}
.bk .t small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;margin-top:4px}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;line-height:1;font-weight:600}
.stat span{font-size:13px;color:var(--muted)}
.rank{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.rank:first-of-type{border-top:0}
.rank i{font-style:normal;font-family:var(--f-display);font-size:20px;color:var(--muted)}
.sent{opacity:.55}
.empty{padding:18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;margin-bottom:12px}
.set{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.set:first-of-type{border-top:0}
.set .l{display:flex;gap:10px;align-items:center}
.set .l input,.sv input[type=checkbox]{width:20px;height:20px;accent-color:var(--blue);flex:0 0 auto}
.sv{display:grid;grid-template-columns:24px 1fr 84px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.sv:first-of-type{border-top:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:90vw}
.okbox{border-color:var(--ok)}
.linkbox{word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;margin:6px 0}
.demo{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:13px;color:var(--muted);margin-bottom:12px}
#printarea{display:none}
@media print{.wrap,.pole,.toast{display:none!important}#printarea{display:block!important;color:#000;background:#fff;font-family:var(--f-body)}
  #printarea table{width:100%;border-collapse:collapse;font-size:12px}#printarea th,#printarea td{border:1px solid #999;padding:4px 6px;text-align:left}}
</style>

<div class="pole" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <h1>सलून बुक</h1>
    <div class="shop" id="shopname"></div>
  </header>
  <main id="app"><div class="empty">लोड हो रहा है…</div></main>
</div>
<div class="toast" id="toast" hidden></div>
<div id="printarea"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ===== सिर्फ़ ये दो चीज़ें अपनी Supabase वाली चिपकानी हैं ===== */
const CFG={
  url:'PASTE_SUPABASE_URL_HERE',
  key:'PASTE_ANON_PUBLIC_KEY_HERE'
};
/* ================================================================ */
(function(){
const configured=!/PASTE_/.test(CFG.url+CFG.key);
const sb=configured&&window.supabase?window.supabase.createClient(CFG.url,CFG.key):null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs=n=>'₹'+Number(n||0).toLocaleString('en-IN');
const today=new Date();today.setHours(0,0,0,0);
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const p2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const WD=['रवि','सोम','मंगल','बुध','गुरु','शुक्र','शनि'];
const MO=['जन','फ़र','मार्च','अप्रै','मई','जून','जुल','अग','सित','अक्टू','नव','दिस'];
const T0=ymd(today),T1=ymd(addD(today,1));
const parseD=ds=>{const[y,m,d]=ds.split('-').map(Number);return new Date(y,m-1,d)};
const daysSince=ds=>ds?Math.round((today-parseD(ds))/864e5):null;
function daysUntil(md){const[m,d]=md.split('-').map(Number);let t=new Date(today.getFullYear(),m-1,d);if(t<today)t=new Date(today.getFullYear()+1,m-1,d);return Math.round((t-today)/864e5)}
function bdayLabel(md){const[m,d]=md.split('-').map(Number);return d+' '+MO[m-1]}
const tm12=t=>{let[h,m]=t.split(':').map(Number);const s=h>=12?'PM':'AM';h=h%12||12;return h+':'+p2(m)+' '+s};
function fmtDay(ds){const x=parseD(ds);const diff=Math.round((x-today)/864e5);return diff===0?'आज':diff===1?'कल':diff===-1?'बीता कल':WD[x.getDay()]+' '+x.getDate()+' '+MO[x.getMonth()]}
const base=()=>location.href.split('#')[0].split('?')[0];
const custLink=slug=>base()+'?shop='+slug;
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600)}
async function ask(p){const r=await p;if(r.error){toast('कुछ गड़बड़ हुई: '+r.error.message);throw r.error}return r.data}

const DEF={remOn:true,remDays:25,bdayOn:true,bdayBefore:5,bdayOff:20,firstOn:true,firstOff:10,refOn:true,refOff:15,
  open:10,close:20,lunch:14,
  tplRem:'नमस्ते {नाम} जी, आपके बाल बड़े हो गए होंगे। आइए, कटवा लीजिए! बुकिंग करें: {लिंक} – {दुकान}',
  tplBday:'जन्मदिन मुबारक {नाम} जी! इस हफ़्ते हमारी तरफ़ से {छूट}% की छूट। बुकिंग करें: {लिंक} – {दुकान}',
  loy:{on:true,need:10,reward:'1 कटिंग फ्री'}};
const DEFSV=[['कटिंग',100,false],['दाढ़ी सेट',60,false],['हेयर वॉश',40,false],['बियर्ड ट्रिम',99,true],['हेड मसाज',199,true],['फेस क्लीनअप',149,true]];
const ST={booked:'बुक',came:'आया',done:'पूरा हुआ',noshow:'नहीं आया',cancel:'रद्द'};
const slotsOf=st=>{const a=[];for(let h=st.open;h<st.close;h++){if(h===st.lunch)continue;a.push(p2(h)+':00',p2(h)+':30')}return a};

function route(){
  const h=location.hash,sp=new URLSearchParams(location.search);
  if(h==='#dukandar'||sp.has('owner'))return{mode:'own'};
  const slug=sp.get('shop')||(h.startsWith('#s-')?h.slice(3):'');
  if(slug)return{mode:'cust',slug};
  return{mode:'home'};
}
const S={r:route(),pub:null,pubErr:'',taken:{},stars:null,done:null,
  draft:{svc:[],date:T0,time:null,name:'',phone:'',bday:'',err:'',busy:false},
  auth:{mode:'login',err:'',busy:false},user:null,shop:null,services:[],offers:[],customers:[],bookings:[],sent:new Set(),
  tab:'bk',bf:'today',q:''};

/* ---------- ग्राहक ---------- */
async function loadPub(){
  const{data,error}=await sb.rpc('get_shop',{p_slug:S.r.slug});
  if(error||!data){S.pubErr='यह दुकान नहीं मिली। लिंक या QR दोबारा जाँचो।'}
  else{S.pub=data;S.pub.settings=Object.assign({},DEF,data.settings||{});await loadTaken(S.draft.date)}
  render();
}
async function loadTaken(d){const{data}=await sb.rpc('get_taken',{p_slug:S.r.slug,p_date:d});S.taken[d]=data||[]}
const activePct=()=>S.pub.offers.reduce((m,o)=>Math.max(m,o.off),0);
function loyCard(){
  const L=S.pub.settings.loy;if(!L||!L.on)return '';
  const n=S.stars==null?0:Math.min(S.stars,L.need);
  const st=Array.from({length:L.need},(_,i)=>`<span style="color:${i<n?'var(--accent)':'var(--line)'};font-size:22px">★</span>`).join('');
  return `<div class="card"><h3>लॉयल्टी कार्ड</h3><div style="display:flex;flex-wrap:wrap;gap:2px;margin-bottom:6px">${st}</div><p class="muted" style="margin:0">हर विज़िट पर 1 स्टार। ${L.need} स्टार पूरे होने पर ${esc(L.reward)}। ${S.stars==null?'अपना नंबर डालो तो अपने स्टार दिखेंगे।':'आपके '+n+' स्टार हैं।'}${n>=L.need?' इनाम तैयार है!':''}</p></div>`;
}
function custView(){
  if(S.pubErr)return `<div class="card"><h2>दुकान नहीं मिली</h2><p class="muted" style="margin:0">${esc(S.pubErr)}</p></div>`;
  if(!S.pub)return '<div class="empty">लोड हो रहा है…</div>';
  const P=S.pub,st=P.settings,d=S.draft;
  if(S.done){const b=S.done;return `
    <div class="card okbox"><h2>बुकिंग पक्की हो गई</h2>
      <p style="margin:0 0 10px">${esc(d.name)} जी, आपका समय ${fmtDay(b.date)} को ${tm12(b.time)} है।</p>
      <p class="muted" style="margin:0 0 4px">${esc(b.names)}</p>
      <div class="row" style="margin:10px 0"><span class="muted">कुल अंदाज़ा</span><span class="total">${rs(b.total)}</span></div>
      <div class="demo" style="margin:0 0 12px">पैसा ऐप में नहीं लगेगा। भुगतान दुकान पर करें।</div>
      <button class="btn block" data-act="newbook">नई बुकिंग करें</button></div>`}
  const main=P.services.filter(s=>!s.is_addon),adds=P.services.filter(s=>s.is_addon);
  const sum=d.svc.reduce((a,id)=>a+((P.services.find(x=>x.id===id)||{}).price||0),0);
  const pct=activePct(),disc=Math.round(sum*pct/100);
  const days=[0,1,2,3,4,5].map(n=>addD(today,n));
  const taken=new Set(S.taken[d.date]||[]);const now=new Date();const nowM=now.getHours()*60+now.getMinutes();
  const opt=(s,up)=>`<label class="opt"><input type="checkbox" data-act="pick" data-v="${s.id}" ${d.svc.includes(s.id)?'checked':''}><span class="n">${esc(s.name)}${up?'<span class="tag">'+s.price+' में जोड़ें</span>':''}</span><span class="price">${rs(s.price)}</span></label>`;
  const banner=P.offers.map(o=>`<div class="card" style="border-color:var(--accent)"><div class="row"><b>${esc(o.name)}</b><span class="tag" style="margin:0">${o.off}% छूट</span></div><div class="muted">${fmtDay(o.end)} तक। कुल रकम में अपने आप घट जाएगी।</div></div>`).join('');
  return `${banner}
  <div class="card"><h2>सर्विस चुनो</h2>${main.map(s=>opt(s,false)).join('')||'<div class="muted">दुकानदार ने अभी सर्विस नहीं जोड़ी।</div>'}</div>
  ${adds.length?`<div class="card"><h2>साथ में जोड़ें</h2>${adds.map(s=>opt(s,true)).join('')}</div>`:''}
  <div class="card"><h2>तारीख और समय</h2>
    <div class="chips" style="margin-bottom:12px">${days.map(x=>`<button class="chip day" data-act="date" data-v="${ymd(x)}" aria-pressed="${d.date===ymd(x)}"><span>${x.getTime()===today.getTime()?'आज':WD[x.getDay()]}</span><span>${x.getDate()} ${MO[x.getMonth()]}</span></button>`).join('')}</div>
    <div class="chips">${slotsOf(st).map(t=>{const[h,m]=t.split(':').map(Number);const off=taken.has(t)||(d.date===T0&&h*60+m<=nowM);return `<button class="chip" data-act="time" data-v="${t}" ${off?'disabled':''} aria-pressed="${d.time===t}">${tm12(t)}</button>`}).join('')}</div>
    <p class="muted small" style="margin:10px 0 0">${st.lunch?tm12(p2(st.lunch)+':00')+' से '+tm12(p2(st.lunch+1)+':00')+' तक दुकान बंद रहती है। ':''}कटे हुए समय पहले से बुक हैं।</p></div>
  <div class="card"><h2>आपकी जानकारी</h2>
    <label class="f" for="c-name">नाम</label><input type="text" id="c-name" autocomplete="name" value="${esc(d.name)}" placeholder="जैसे: अजय कुमार">
    <label class="f" for="c-phone">मोबाइल नंबर</label><input type="tel" id="c-phone" inputmode="numeric" maxlength="10" autocomplete="tel" value="${esc(d.phone)}" placeholder="10 अंकों का नंबर">
    <label class="f" for="c-bday">जन्मतिथि (वैकल्पिक)</label><input type="date" id="c-bday" value="${esc(d.bday)}">
    <p class="muted small" style="margin:6px 0 0">जन्मदिन पर सरप्राइज़ ऑफ़र पाने के लिए। साल बताना ज़रूरी नहीं। आपका नंबर सिर्फ़ इस दुकान के पास रहेगा।</p></div>
  <div class="card">
    ${disc?`<div class="row muted" style="margin-bottom:4px"><span>ऑफ़र छूट</span><span>− ${rs(disc)}</span></div>`:''}
    <div class="row"><span>कुल अंदाज़ा</span><span class="total">${rs(sum-disc)}</span></div>
    ${st.firstOn?`<p class="muted small" style="margin:8px 0 0">पहली बार आने पर ${st.firstOff}% छूट। यह दुकान पर बिल में कटेगी।</p>`:''}
    ${d.err?`<div class="err" role="alert">${esc(d.err)}</div>`:''}
    <button class="btn block" style="margin-top:12px" data-act="book" ${d.busy?'disabled':''}>${d.busy?'बुकिंग हो रही है…':'बुकिंग पक्की करें'}</button>
    <p class="muted small" style="margin:10px 0 0;text-align:center">भुगतान दुकान पर होगा। ऐप में कोई पैसा नहीं लगता।</p></div>
  ${loyCard()}
  ${st.refOn?`<div class="card"><h3>दोस्त को भेजो</h3><p class="muted" style="margin:0">दोस्त के पहली बार आने पर आप दोनों को ${st.refOff}% छूट मिलेगी।</p></div>`:''}`;
}

/* ---------- दुकानदार: लॉगिन ---------- */
const mailOf=m=>'91'+m+'@salonbook.app';
async function loadOwner(){
  const sh=await sb.from('shops').select('*').eq('owner',S.user.id).maybeSingle();
  S.shop=sh.data;if(!S.shop)return;
  S.shop.settings=Object.assign({},DEF,S.shop.settings||{});
  const id=S.shop.id;
  const[sv,of,cu,bk,sl]=await Promise.all([
    sb.from('services').select('*').eq('shop_id',id).order('is_addon').order('sort'),
    sb.from('offers').select('*').eq('shop_id',id).order('end_date',{ascending:false}),
    sb.from('customers').select('*').eq('shop_id',id),
    sb.from('bookings').select('*').eq('shop_id',id).gte('date',ymd(addD(today,-120))).order('date'),
    sb.from('sent_log').select('key').eq('shop_id',id)]);

    <div class="acts" style="margin-top:0"><button class="btn sm" data-act="dl" data-v="cu">ग्राहक लिस्ट (Excel)</button><button class="btn sm" data-act="dl" data-v="bk">बुकिंग (Excel)</button>
    <button class="btn sm ghost" data-act="pdf" data-v="cu">ग्राहक लिस्ट (PDF)</button><button class="btn sm ghost" data-act="pdf" data-v="bk">बुकिंग (PDF)</button></div>
    <p class="muted small" style="margin:8px 0 0">PDF के लिए खुलने वाली स्क्रीन में "Save as PDF" या "PDF में सेव" चुनो।</p></div>
  <div class="card"><h2>पासवर्ड बदलो</h2><label class="f" for="np" style="margin-top:0">नया पासवर्ड (कम से कम 6 अक्षर)</label><input type="password" id="np" autocomplete="new-password">
    <button class="btn sm ghost" style="margin-top:10px" data-act="pw">पासवर्ड बदलो</button></div>
  <button class="btn block ghost" data-act="logout">लॉग-आउट</button>`;
}

/* ---------- सेटअप / होम ---------- */
function setupView(){return `<div class="card"><h2>सेटअप बाक़ी है</h2><p class="muted" style="margin:0">कोड में सबसे ऊपर CFG वाले हिस्से में Supabase का Project URL और anon public key चिपकाओ, फिर पेज दोबारा खोलो।</p></div>`}
function homeView(){return `<div class="card"><h2>दुकानदार के लिए</h2><p class="muted" style="margin:0 0 12px">अपनी दुकान बनाओ या लॉगिन करो।</p><a class="btn block" href="#dukandar">दुकानदार लॉगिन</a></div>
  <div class="card"><h3>ग्राहक के लिए</h3><p class="muted" style="margin:0">बुकिंग के लिए दुकान पर लगा QR स्कैन करो या दुकानदार का भेजा लिंक खोलो।</p></div>`}

function render(){
  let h;
  if(!configured||!sb)h=setupView();
  else if(S.r.mode==='cust')h=custView();
  else if(S.r.mode==='own')h=ownView();
  else h=homeView();
  $('#shopname').textContent=S.r.mode==='cust'&&S.pub?S.pub.name:S.r.mode==='own'&&S.shop?S.shop.name:'';
  $('#app').innerHTML=h;
}

/* ---------- डाउनलोड ---------- */
function tableData(w){
  if(w==='cu')return{title:'ग्राहक लिस्ट',head:['नाम','मोबाइल','जन्मदिन','विज़िट','कुल ख़र्च','स्टार','आख़िरी विज़िट'],
    rows:S.customers.map(c=>[c.name,c.phone,c.bday,c.visits,c.spent,c.stars,c.last_visit||''])};
  return{title:'बुकिंग',head:['तारीख','समय','नाम','मोबाइल','सर्विस','रकम','स्थिति'],
    rows:[...S.bookings].sort((a,b)=>b.date.localeCompare(a.date)||a.time.localeCompare(b.time)).map(b=>[b.date,b.time,b.customer_name,b.customer_phone,b.svc_names,b.total,ST[b.status]])};
}
function download(w){
  const t=tableData(w);
  const csv='\ufeff'+[t.head,...t.rows].map(r=>r.map(x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"').join(',')).join('\n');
  const u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=u;a.download=(w==='cu'?'grahak-list':'bookings')+'-'+T0+'.csv';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),4000);
}
function pdf(w){
  const t=tableData(w);
  $('#printarea').innerHTML='<h2>'+esc(S.shop.name)+' – '+t.title+' ('+T0+')</h2><table><thead><tr>'+t.head.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+
    t.rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  window.print();
}

/* ---------- इवेंट ---------- */
document.addEventListener('input',e=>{
  const id=e.target.id,d=S.draft;
  if(id==='c-name')d.name=e.target.value;
  if(id==='c-phone')d.phone=e.target.value.replace(/\D/g,'');
  if(id==='c-bday')d.bday=e.target.value;
  if(id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos)}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.act==='pick'){const a=S.draft.svc,i=a.indexOf(t.dataset.v);if(t.checked&&i<0)a.push(t.dataset.v);if(!t.checked&&i>=0)a.splice(i,1);render()}
  if(t.id==='c-phone'&&S.draft.phone.length===10&&sb){const{data}=await sb.rpc('get_stars',{p_slug:S.r.slug,p_phone:S.draft.phone});S.stars=data;render()}
});
const val=id=>{const e=document.getElementById(id);return e?e.value:''};
const num=(id,mn,mx,df)=>{const v=parseInt(val(id),10);return isNaN(v)?df:Math.max(mn,Math.min(mx,v))};
const chk=id=>{const e=document.getElementById(id);return !!(e&&e.checked)};
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;
  const a=b.dataset.act,v=b.dataset.v,d=S.draft;
  if(a==='authmode')e.preventDefault();
  try{
  if(a==='date'){d.date=v;d.time=null;render();await loadTaken(v);render();return}
  if(a==='time'){d.time=v;render();return}
  if(a==='newbook'){S.done=null;S.draft={svc:[],date:T0,time:null,name:'',phone:'',bday:'',err:'',busy:false};S.stars=null;await loadTaken(T0);render();return}
  if(a==='book'){
    d.name=val('c-name').trim()||d.name;d.phone=(val('c-phone')||d.phone).replace(/\D/g,'');d.bday=val('c-bday')||d.bday;
    d.err=!d.svc.length?'पहले कोई सर्विस चुनो।':!d.time?'समय चुनो।':d.name.trim().length<2?'अपना नाम लिखो।':d.phone.length!==10?'मोबाइल नंबर 10 अंकों का होना चाहिए।':'';
    if(d.err){render();return}
    d.busy=true;render();
    const{data,error}=await sb.rpc('create_booking',{p_slug:S.r.slug,p_name:d.name.trim(),p_phone:d.phone,p_bday:d.bday?d.bday.slice(5):'',p_date:d.date,p_time:d.time,p_svc:d.svc});
    d.busy=false;
    if(error){d.err=error.message;await loadTaken(d.date);render();return}
    S.done=data;render();window.scrollTo(0,0);return;
  }
  if(a==='authmode'){S.auth={mode:v,err:'',busy:false};render();return}
  if(a==='login'||a==='signup'){
    const m=val('a-mob').replace(/\D/g,''),p=val('a-pass'),nm=val('a-shop').trim();
    if(m.length!==10){S.auth.err='मोबाइल नंबर 10 अंकों का होना चाहिए।';render();return}
    if(p.length<6){S.auth.err='पासवर्ड कम से कम 6 अक्षर का रखो।';render();return}
    if(a==='signup'&&nm.length<2){S.auth.err='दुकान का नाम लिखो।';render();return}
    S.auth.busy=true;S.auth.err='';render();
    if(a==='login'){
      const{data,error}=await sb.auth.signInWithPassword({email:mailOf(m),password:p});
      S.auth.busy=false;
      if(error){S.auth.err='मोबाइल नंबर या पासवर्ड गलत है।';render();return}
      S.user=data.user;await loadOwner();render();return;
    }
    const{data,error}=await sb.auth.signUp({email:mailOf(m),password:p});
    S.auth.busy=false;
    if(error){S.auth.err=/regist/i.test(error.message)?'यह नंबर पहले से जुड़ा है। लॉगिन करो।':error.message;render();return}
    if(!data.session){S.auth.err='Supabase में Authentication → Providers → Email में "Confirm email" बंद करो, फिर दोबारा कोशिश करो।';render();return}
    S.user=data.user;
    const sh=await ask(sb.from('shops').insert({owner:S.user.id,slug:mkSlug(nm),name:nm,phone:m,settings:DEF}).select().single());
    await ask(sb.from('services').insert(DEFSV.map((x,i)=>({shop_id:sh.id,name:x[0],price:x[1],is_addon:x[2],sort:i}))));
    await loadOwner();render();toast('दुकान बन गई। सेटिंग में अपने रेट जाँच लो।');return;
  }
  if(a==='logout'){await sb.auth.signOut();S.user=null;S.shop=null;S.auth={mode:'login',err:'',busy:false};render();return}
  if(a==='tab'){S.tab=v;render();window.scrollTo(0,0);return}
  if(a==='bf'){S.bf=v;render();return}
  if(a==='st'){
    const bk=S.bookings.find(x=>x.id===b.dataset.id);
    await ask(sb.from('bookings').update({status:v}).eq('id',bk.id));bk.status=v;
    if(v==='done'){const c=S.customers.find(x=>x.phone===bk.customer_phone);
      if(c){const u={last_visit:T0,visits:c.visits+1,spent:c.spent+bk.total,stars:c.stars+1};await ask(sb.from('customers').update(u).eq('id',c.id));Object.assign(c,u)}}
    render();toast(v==='done'?'पूरा हुआ। कमाई और स्टार में जुड़ गया।':'बुकिंग अपडेट हो गई।');return;
  }
  if(a==='send'){const k=b.dataset.k;setTimeout(async()=>{S.sent.add(k);render();try{await ask(sb.from('sent_log').upsert({shop_id:S.shop.id,key:k}))}catch(_){}},60);return}
  if(a==='cuadd'){
    const nm=val('cu-name').trim(),ph=val('cu-phone').replace(/\D/g,''),bd=val('cu-bday');
    if(nm.length<2||ph.length!==10){toast('नाम और 10 अंकों का मोबाइल नंबर भरो।');return}
    if(S.customers.some(c=>c.phone===ph)){toast('यह नंबर पहले से लिस्ट में है।');return}
    const row=await ask(sb.from('customers').insert({shop_id:S.shop.id,name:nm,phone:ph,bday:bd?bd.slice(5):''}).select().single());
    S.customers.push(row);render();toast('ग्राहक जुड़ गया।');return;
  }
  if(a==='reward'){const c=S.customers.find(x=>x.id===b.dataset.id),n=Math.max(0,c.stars-S.shop.settings.loy.need);
    await ask(sb.from('customers').update({stars:n}).eq('id',c.id));c.stars=n;render();toast('इनाम दे दिया। स्टार घट गए।');return}
  if(a==='offadd'){
    const nm=val('of-name').trim(),off=num('of-off',0,100,0),end=val('of-end');
    if(!nm||off<1||!end){toast('ऑफ़र का नाम, छूट % और आख़िरी तारीख भरो।');return}
    const row=await ask(sb.from('offers').insert({shop_id:S.shop.id,name:nm,off_pct:off,end_date:end}).select().single());
    S.offers.unshift(row);render();toast('ऑफ़र बन गया। ग्राहक पेज पर दिखेगा।');return;
  }
  if(a==='offtog'){const o=S.offers.find(x=>x.id===b.dataset.id);await ask(sb.from('offers').update({active:!o.active}).eq('id',o.id));o.active=!o.active;render();return}
  if(a==='offdel'){await ask(sb.from('offers').delete().eq('id',b.dataset.id));S.offers=S.offers.filter(x=>x.id!==b.dataset.id);render();return}
  if(a==='loysave'){
    const st=Object.assign({},S.shop.settings,{loy:{on:chk('lo-on'),need:num('lo-need',2,30,10),reward:val('lo-reward').trim()||'1 कटिंग फ्री'}});
    await ask(sb.from('shops').update({settings:st}).eq('id',S.shop.id));S.shop.settings=st;render();toast('लॉयल्टी सेटिंग सेव हो गई।');return;
  }
  if(a==='svadd'){
    const nm=val('ns-name').trim(),pr=num('ns-price',0,9999,-1);
    if(nm.length<2||pr<0){toast('सर्विस का नाम और रेट भरो।');return}
    const row=await ask(sb.from('services').insert({shop_id:S.shop.id,name:nm,price:pr,is_addon:chk('ns-add'),sort:S.services.length+1}).select().single());
    S.services.push(row);render();toast('सर्विस जुड़ गई।');return;
  }
  if(a==='save'){
    const s=S.shop.settings;
    const st=Object.assign({},s,{open:num('open',0,23,10),close:num('close',1,24,20),lunch:num('lunch',0,23,0),
      remDays:num('remDays',1,365,25),remOn:chk('remDays-on'),bdayBefore:num('bdayBefore',0,60,5),bdayOn:chk('bdayBefore-on'),bdayOff:num('bdayOff',0,100,20),
      firstOff:num('firstOff',0,100,10),firstOn:chk('firstOff-on'),refOff:num('refOff',0,100,15),refOn:chk('refOff-on'),
      tplRem:val('tplRem'),tplBday:val('tplBday')});
    if(st.close<=st.open){toast('बंद होने का समय खुलने के बाद का रखो।');return}
    await ask(sb.from('shops').update({settings:st}).eq('id',S.shop.id));S.shop.settings=st;
    await Promise.all(S.services.map(x=>{const u={name:val('sn-'+x.id).trim()||x.name,price:num('sp-'+x.id,0,9999,x.price),active:chk('sa-'+x.id)};
      return ask(sb.from('services').update(u).eq('id',x.id)).then(()=>Object.assign(x,u))}));
    render();toast('सेटिंग सेव हो गई। ग्राहक को अब नया रेट दिखेगा।');return;
  }
  if(a==='copy'){try{await navigator.clipboard.writeText(v);toast('लिंक कॉपी हो गया।')}catch(_){toast('कॉपी नहीं हुआ। लिंक को दबाकर रखो और कॉपी करो।')}return}
  if(a==='dl'){download(v);return}
  if(a==='pdf'){pdf(v);return}
  if(a==='pw'){
    const p=val('np');if(p.length<6){toast('पासवर्ड कम से कम 6 अक्षर का रखो।');return}
    await ask({then:r=>sb.auth.updateUser({password:p}).then(r)});toast('पासवर्ड बदल गया।');return;
  }
  }catch(err){console.error(err);d.busy=false;S.auth.busy=false}
});

addEventListener('hashchange',async()=>{S.r=route();await boot()});
async function boot(){
  render();
  if(!configured||!sb)return;
  if(S.r.mode==='cust'&&!S.pub&&!S.pubErr)await loadPub();
  if(S.r.mode==='own'&&!S.user){
    const{data}=await sb.auth.getSession();
    if(data.session){S.user=data.session.user;await loadOwner()}
    render();
  }
}
boot();
})();
</script>
